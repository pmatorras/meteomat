name: Deploy Dashboard to HF Space (Betatest)

on:
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Hugging Face (betatest)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Create a clean temporary directory
          mkdir /tmp/hf_deploy
          
          # 2. Copy all files EXCEPT the .git folder and the DB files
          rsync -av --exclude='.git' --exclude='data/*.db' ./ /tmp/hf_deploy/
          
          # 3. Go into the clean directory
          cd /tmp/hf_deploy
          
          # Tag the space title for betatest
          sed -i 's/^title: Meteomat$/title: Meteomat (betatest)/' hf_space_metadata.yml
          sed -i 's/\("title": ".*\)"/\1 (betatest)"/' src/meteomat/cfg/config.py

          # 4. Merge the README with the HF metadata
          cat hf_space_metadata.yml > hf_readme.md
          echo "" >> hf_readme.md
          cat README.md >> hf_readme.md
          mv hf_readme.md README.md
          
          # 5. Initialize a brand new git repo (NO HISTORY)
          git init
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          
          # 6. Commit the current state
          git add .
          git commit -m "Deploy from GitHub Actions"
          
          # 7. Force push to the 'main' branch on Hugging Face
          git push -f https://pmatorras:$HF_TOKEN@huggingface.co/spaces/pmatorras/meteomat_betatest HEAD:main
